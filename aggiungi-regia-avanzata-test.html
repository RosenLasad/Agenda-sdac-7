<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST · Regia Avanzata</title><style>body{font:16px system-ui;background:#f3f5f8;color:#192637;margin:0;padding:24px}main{max-width:620px;margin:30px auto;padding:28px;background:white;border-radius:16px;box-shadow:0 5px 18px #162a3d18}button{padding:11px 17px;border:1px solid #345;border-radius:9px;background:#173e69;color:white;cursor:pointer;margin:6px 5px 6px 0}button:disabled{opacity:.45;cursor:not-allowed}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:14px;border-radius:9px}small{color:#506070}</style></head><body><main><h1>Agenda SDAC · TEST</h1><h2>Inserimento controllato: Regia Avanzata</h2><p>Solo Deploy Preview, solo Admin. Non modifica l'archivio ufficiale.</p><p><button id="login">Accedi come Admin</button><button id="check">Verifica archivio TEST</button><button id="add" disabled>Aggiungi corso al TEST</button></p><pre id="out" role="status">Accedi e premi Verifica archivio.</pre><small>La modifica avviene solo dopo la conferma esplicita e conserva una copia prima della scrittura.</small></main><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><script>
const out=document.getElementById('out'),add=document.getElementById('add');let preview=null;
function msg(v){out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}
function token(){return window.netlifyIdentity?.currentUser()?.token?.access_token || null}
async function api(method,body){const user=window.netlifyIdentity?.currentUser();if(!user)throw Error('Accedi come Admin.');const jwt=await user.jwt(); const res=await fetch('/.netlify/functions/add-regia-avanzata-test',{method,headers:{Authorization:'Bearer '+jwt,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'Operazione non riuscita');return data}
document.getElementById('login').onclick=()=>window.netlifyIdentity?.open('login');
document.getElementById('check').onclick=async()=>{add.disabled=true;preview=null;try{const data=await api('GET');preview=data;msg(data);add.disabled=!!data.alreadyPresent}catch(e){msg(e.message)}};
add.onclick=async()=>{if(!preview||preview.alreadyPresent)return; if(!confirm('Confermi l’aggiunta di Regia Avanzata SOLO nell’archivio TEST?'))return;add.disabled=true;try{const data=await api('POST',{confirmation:'AGGIUNGI REGIA AVANZATA TEST',baseUpdatedAt:preview.updatedAt});msg(data);preview=null}catch(e){msg(e.message)}};
window.netlifyIdentity?.on('logout',()=>{preview=null;add.disabled=true;msg('Sessione chiusa')});
</script></body></html>
